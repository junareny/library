server:
  port: ${SERVER_PORT:8080}
spring:
  messages:
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  jwt-secret: ${JWT_SECRET:}
  jwt-issuer: library-api
  jwt-ttl-seconds: 7200

mybatis-plus:
  mapper-locations: classpath*:/com/rxs/library/**/infrastructure/mapper/xml/*.xml
  type-handlers-package: com.rxs.library.infrastructure.typehandler
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT
    cache-enabled: false
